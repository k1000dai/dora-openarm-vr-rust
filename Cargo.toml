[package]
name = "dora-openarm-vr-rust"
version = "0.1.0"
authors = ["Enactic, Inc."]
description = "Meta Quest VR pose receiver for OpenArm teleoperation (Rust port of dora-openarm-vr)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/k1000dai/dora-openarm-vr-rust"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dora_openarm_vr_rust"
path = "src/lib.rs"

[[bin]]
name = "dora-openarm-quest-receiver"
path = "src/main.rs"

[dependencies]
# Pinned to the Arrow version that dora-node-api 0.5.0 depends on,
# so that `ArrayRef` values cross the library/adapter boundary as the same type.
arrow = "=54.2.1"
clap = { version = "4", features = ["derive"] }
dora-node-api = { version = "0.5.0", default-features = false }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
